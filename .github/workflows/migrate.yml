# Apply Supabase migrations when a new one lands on main.
#
# Migrations are the one thing here that is genuinely irreversible, so this runs ONLY on main and
# only when supabase/migrations/ changed — never on a branch, never speculatively.
name: Apply migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch: {}

concurrency:
  # Two migration runs at once against one database is how you get a half-applied schema.
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The access token is the ONLY credential needed — `link` and `db push` both authenticate with
      # it, verified against the live project from a clean directory. There is no DB password here
      # because the CLI never opens a direct psql connection for this.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: felyggqjjhltwokdfhop
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      # --dry-run first: it prints what WOULD be applied. A migration list that looks wrong here is
      # the last cheap moment to notice, before it has touched the live database.
      - run: supabase db push --dry-run
      - run: supabase db push
